# ==========================
# Database
# ==========================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecomdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:ecomuser}
spring.datasource.password=${DB_PASSWORD:ecompass}

# ==========================
# Hibernate
# ==========================

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL
logging.level.org.hibernate.SQL=DEBUG

# ==========================
# Server
# ==========================

server.port=8081

# ==========================
# Banner
# ==========================

spring.banner.charset=UTF-8